<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Simulador de Escala — cartão e horário</title>
  <desc id="desc">Cartão tridimensional com três faixas de turnos e um relógio azul sobreposto.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#28517C"/>
      <stop offset=".44" stop-color="#142D50"/>
      <stop offset="1" stop-color="#09182E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".12" cy=".02" r=".95">
      <stop stop-color="#83C9FA" stop-opacity=".31"/>
      <stop offset="1" stop-color="#83C9FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FCFF"/>
      <stop offset=".56" stop-color="#E1F0FA"/>
      <stop offset="1" stop-color="#AFC9DA"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7BCBFB"/>
      <stop offset="1" stop-color="#397DD6"/>
    </linearGradient>
    <linearGradient id="dialRim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E9F9FF"/>
      <stop offset=".46" stop-color="#A6D8F2"/>
      <stop offset="1" stop-color="#4876AB"/>
    </linearGradient>
    <radialGradient id="dial" cx=".28" cy=".23" r=".9">
      <stop stop-color="#316798"/>
      <stop offset=".65" stop-color="#1A3D67"/>
      <stop offset="1" stop-color="#102B50"/>
    </radialGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.8">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#background)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect x="28" y="28" width="456" height="456" rx="112" fill="none" stroke="#DDF5FF" stroke-opacity=".13" stroke-width="3"/>

  <rect x="103" y="123" width="306" height="289" rx="54" fill="#051226" opacity=".66" filter="url(#shadow)"/>
  <rect x="115" y="118" width="294" height="294" rx="48" fill="#638AA8"/>
  <rect x="103" y="103" width="294" height="294" rx="48" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="4"/>
  <path d="M151 104h198a48 48 0 0 1 48 48v35H103v-35a48 48 0 0 1 48-48Z" fill="url(#header)"/>
  <path d="M130 121c7-8 15-10 28-10h170" fill="none" stroke="#EAFBFF" stroke-opacity=".65" stroke-linecap="round" stroke-width="7"/>
  <rect x="139" y="216" width="184" height="27" rx="13.5" fill="#45BBD1"/>
  <rect x="139" y="264" width="149" height="27" rx="13.5" fill="#5988EB"/>
  <rect x="139" y="312" width="125" height="27" rx="13.5" fill="#EFAC54"/>
  <g fill="#FFFFFF" opacity=".58">
    <rect x="148" y="219" width="149" height="6" rx="3"/>
    <rect x="148" y="267" width="118" height="6" rx="3"/>
    <rect x="148" y="315" width="92" height="6" rx="3"/>
  </g>

  <circle cx="342" cy="337" r="94" fill="#06162E" opacity=".68" filter="url(#shadow)"/>
  <circle cx="345" cy="343" r="86" fill="#123154"/>
  <circle cx="337" cy="333" r="86" fill="url(#dialRim)"/>
  <circle cx="337" cy="333" r="70" fill="url(#dial)"/>
  <path d="M337 287v47l34 23" fill="none" stroke="#F4FBFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="337" cy="333" r="10" fill="#F6BA69"/>
  <path d="M294 282a67 67 0 0 1 35-17" fill="none" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="7" stroke-linecap="round"/>
</svg>
