<!doctype html>
<meta charset="utf-8">
<title>Calendar core checks</title>
<script src="../../docs/demo/calendar-core.js"></script>
<script src="../../docs/demo/report-core.js"></script>
<script src="../../docs/demo/report-xlsx.js"></script>
<pre id="result">RUNNING</pre>
<script>
(() => {
    const core = window.ScaleCalendarCore;
    const checks = [];
    const assert = (name, condition, detail = "") => {
        if (!condition) throw new Error(`${name}${detail ? `: ${detail}` : ""}`);
        checks.push(name);
    };
    const date = (value) => new Date(value + "T00:00:00");
    const clock = (value) => new Date(value);

    try {
        const january = new Date(2026, 11, 1);
        const januaryNext = core.moveMonth(january, 1);
        assert("month navigation crosses year", januaryNext.getFullYear() === 2027 && januaryNext.getMonth() === 0);
        assert("leap month has 29 dates", core.monthCells(new Date(2028, 1, 1)).filter(Boolean).length === 29);
        assert("6x3 cycle continues across month boundary", core.cycleDaysStatus(date("2026-01-29"), date("2026-02-04"), 6, 3) === "Folga");
        assert("rotating shift wraps at month boundary", core.rotativeStatus(date("2026-01-30"), date("2026-02-01"), ["Manhã", "Tarde", "Noite"]) === "Noite");
        const dayTwo = core.cycleHoursSegments(clock("2026-01-01T18:00"), date("2026-01-02"), 12, 36);
        assert("12x36 exposes partial work and rest periods", dayTwo.length === 2 && dayTwo[0].startMinute === 0 && dayTwo[0].endMinute === 360 && dayTwo[0].status === "Trabalhando" && dayTwo[1].startMinute === 360 && dayTwo[1].endMinute === 1440 && dayTwo[1].status === "Folga");
        assert("12x36 query uses the selected clock time", core.cycleHoursStatus(clock("2026-01-01T18:00"), clock("2026-01-02T05:59"), 12, 36) === "Trabalhando" && core.cycleHoursStatus(clock("2026-01-01T18:00"), clock("2026-01-02T06:00"), 12, 36) === "Folga");
        assert("12x36 next change crosses midnight at 06:00", core.nextChange(
            { type: "ciclo_horas", start: clock("2026-01-01T18:00"), work: 12, off: 36 },
            clock("2026-01-02T05:59")
        ).getTime() === clock("2026-01-02T06:00").getTime());
        assert("5x2 next change follows its confirmed date", core.nextChange(
            { type: "ciclo_dias", start: date("2026-10-19"), work: 5, off: 2 },
            date("2026-10-23")
        ).getTime() === date("2026-10-24").getTime());
        assert("rotating next change works before the anchor", core.nextChange(
            { type: "turno_rotativo", start: date("2026-10-01"), turns: ["Manhã", "Tarde", "Folga"] },
            date("2026-09-30")
        ).getTime() === date("2026-10-01").getTime());
        const beforeAnchor = core.compareDay(
            { type: "ciclo_dias", start: date("2026-02-01"), work: 6, off: 3 },
            { type: "ciclo_dias", start: date("2026-02-01"), work: 5, off: 2 },
            date("2026-01-28"), "06:00"
        );
        assert("comparison wraps correctly for a date before both anchors", beforeAnchor.statusA === "Trabalhando" && beforeAnchor.statusB === "Trabalhando");
        const differentAnchors = core.compareDay(
            { type: "ciclo_dias", start: date("2026-01-01"), work: 6, off: 3 },
            { type: "ciclo_dias", start: date("2026-01-04"), work: 6, off: 3 },
            date("2026-01-03"), "06:00"
        );
        assert("two compared scales keep independent anchors", differentAnchors.statusA === "Trabalhando" && differentAnchors.statusB === "Folga");
        const hoursA = { type: "ciclo_horas", start: clock("2026-01-01T18:00"), work: 12, off: 36 };
        const beforeSwap = core.compareDay(hoursA, hoursA, date("2026-01-02"), "05:59");
        const afterSwap = core.compareDay(hoursA, hoursA, date("2026-01-02"), "06:00");
        assert("12x36 comparison changes at the exact work-to-rest boundary", beforeSwap.statusA === "Trabalhando" && afterSwap.statusA === "Folga");
        assert("12x36 comparison detail preserves both real intervals", afterSwap.intervalsA.length === 2 && afterSwap.intervalsA[0].endMinute === 360 && afterSwap.intervalsA[1].startMinute === 360);
        const monthly = core.compareMonth(
            { type: "ciclo_dias", start: date("2026-01-01"), work: 6, off: 3 },
            { type: "ciclo_horas", start: clock("2026-01-01T00:00"), work: 12, off: 36 },
            date("2026-01-15"), "06:00"
        );
        assert("monthly summary counts only observed statuses at the chosen time", monthly.days.length === 31 && monthly.summary.aWorking === 22 && monthly.summary.bWorking === 16 && monthly.summary.bothOff === 4, JSON.stringify(monthly.summary));
        const reportLeap = window.ScaleReportCore.createMonthlyReport({
            mode: "single",
            month: new Date(2028, 1, 1),
            time: "06:00",
            scaleA: { type: "ciclo_dias", start: date("2028-02-01"), work: 6, off: 3, name: "6x3", parameters: "6/3", anchor: "01/02/2028", source: "Modelo pronto" }
        });
        assert("monthly report includes all dates in leap February", reportLeap.rows.length === 29 && reportLeap.rows[28].dateLabel === "29/02/2028");
        assert("day-only report does not require or display an observation time", !reportLeap.usesTime && reportLeap.time === null && window.ScaleReportCore.createMonthlyReport({ mode: "single", month: new Date(2028, 1, 1), time: "", scaleA: reportLeap.scaleA }).rows.length === 29);
        const monthLengths = [[2027, 1, 28], [2028, 1, 29], [2028, 3, 30], [2028, 0, 31]].map(([year, month]) =>
            window.ScaleReportCore.createMonthlyReport({
                mode: "single",
                month: new Date(year, month, 1),
                time: "06:00",
                scaleA: { type: "ciclo_dias", start: date(`${year}-01-01`), work: 6, off: 3, name: "6x3", parameters: "6/3", anchor: "01/01", source: "Modelo pronto" }
            }).rows.length
        );
        assert("monthly reports contain the correct 28, 29, 30, and 31 dates", JSON.stringify(monthLengths) === JSON.stringify([28, 29, 30, 31]));
        const reportEarly = window.ScaleReportCore.createMonthlyReport({
            mode: "single",
            month: new Date(2026, 1, 1),
            time: "05:59",
            scaleA: { type: "ciclo_horas", start: clock("2026-01-31T18:00"), work: 12, off: 36, name: "12x36", parameters: "12/36", anchor: "31/01/2026 18:00", source: "Modelo pronto" }
        });
        const reportAtSwap = window.ScaleReportCore.createMonthlyReport({
            mode: "single",
            month: new Date(2026, 1, 1),
            time: "06:00",
            scaleA: reportEarly.scaleA
        });
        assert("12x36 report crosses midnight and follows the exact change time", reportEarly.rows[0].dateLabel === "01/02/2026" && reportEarly.rows[0].statusA === "Trabalhando" && reportAtSwap.rows[0].statusA === "Folga");
        assert("12x36 report identifies a transition inside the same date", reportEarly.rows[0].transitionA && reportAtSwap.rows[0].transitionA);
        const independentReport = window.ScaleReportCore.createMonthlyReport({
            mode: "compare",
            month: new Date(2026, 0, 1),
            time: "06:00",
            scaleA: { type: "ciclo_dias", start: date("2026-01-01"), work: 6, off: 3, name: "A", parameters: "6/3", anchor: "01/01/2026", source: "Modelo pronto" },
            scaleB: { type: "ciclo_dias", start: date("2026-01-04"), work: 6, off: 3, name: "B", parameters: "6/3", anchor: "04/01/2026", source: "Modelo pronto" }
        });
        assert("report keeps each scale's independent anchor", independentReport.rows[2].statusA === "Trabalhando" && independentReport.rows[2].statusB === "Folga");

        const riskyName = '=HYPERLINK("http://example.invalid";"clicar")\n+1';
        const csvReport = window.ScaleReportCore.createMonthlyReport({
            mode: "compare",
            month: new Date(2028, 1, 1),
            time: "06:00",
            scaleA: { type: "ciclo_dias", start: date("2028-02-01"), work: 6, off: 3, name: riskyName, parameters: "6/3", anchor: "01/02/2028", source: "Neste navegador" },
            scaleB: { type: "ciclo_horas", start: clock("2028-02-01T18:00"), work: 12, off: 36, name: "B", parameters: "12/36", anchor: "01/02/2028 18:00", source: "Modelo pronto" }
        });
        const csvText = window.ScaleReportCore.createCsv(csvReport);
        assert("CSV identifies the same readable origin shown in the preview", csvText.includes('"Origem da Escala A";"Neste navegador"') && csvText.includes('"Origem da Escala B";"Modelo pronto"'));
        assert("CSV has UTF-8 BOM and formula-leading text is apostrophe-protected", csvText.charCodeAt(0) === 0xFEFF && csvText.includes("'=HYPERLINK"));
        assert("CSV escapes separators, embedded quotes, and line breaks", csvText.includes('"\' =HYPERLINK') === false && csvText.includes('"\'=HYPERLINK(""http://example.invalid"";""clicar"")\n+1"'));
        const csvRows = [];
        let row = [];
        let cell = "";
        let quoted = false;
        for (let index = 1; index < csvText.length; index += 1) {
            const char = csvText[index];
            if (quoted && char === '"' && csvText[index + 1] === '"') { cell += '"'; index += 1; }
            else if (char === '"') quoted = !quoted;
            else if (char === ";" && !quoted) { row.push(cell); cell = ""; }
            else if ((char === "\n" || char === "\r") && !quoted) {
                if (char === "\r" && csvText[index + 1] === "\n") index += 1;
                row.push(cell); csvRows.push(row); row = []; cell = "";
            } else cell += char;
        }
        if (cell || row.length) { row.push(cell); csvRows.push(row); }
        const recordsHeader = csvRows.findIndex((csvRow) => csvRow[0] === "Data");
        const exportedRecords = csvRows.slice(recordsHeader + 1);
        assert("CSV data rows match every record in the monthly preview", recordsHeader > 0 && exportedRecords.length === csvReport.rows.length && exportedRecords[0][0] === csvReport.rows[0].dateLabel && exportedRecords[0][1] === csvReport.rows[0].weekday && exportedRecords[0][2] === csvReport.rows[0].statusA && exportedRecords[0][3] === csvReport.rows[0].statusB);
        const xlsx = window.ScaleReportXlsx.createXlsx(csvReport);
        const view = new DataView(xlsx.buffer);
        const decoder = new TextDecoder();
        const parts = new Map();
        for (let offset = 0; view.getUint32(offset, true) === 0x04034B50;) {
            const length = view.getUint32(offset + 18, true);
            const nameLength = view.getUint16(offset + 26, true);
            const name = decoder.decode(xlsx.subarray(offset + 30, offset + 30 + nameLength));
            parts.set(name, decoder.decode(xlsx.subarray(offset + 30 + nameLength, offset + 30 + nameLength + length)));
            offset += 30 + nameLength + length;
        }
        assert("XLSX contains the workbook, styled monthly calendar, and detailed records", parts.size === 7 && parts.has("xl/workbook.xml") && parts.has("xl/styles.xml") && parts.has("xl/worksheets/sheet1.xml") && parts.has("xl/worksheets/sheet2.xml"));
        const namespace = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
        const sheet = new DOMParser().parseFromString(parts.get("xl/worksheets/sheet2.xml"), "application/xml");
        const xlsxRows = Array.from(sheet.getElementsByTagNameNS(namespace, "row")).filter((record) => Number(record.getAttribute("r")) >= 6);
        const values = xlsxRows.map((record) => Array.from(record.getElementsByTagNameNS(namespace, "c"), (cellNode) => cellNode.getElementsByTagNameNS(namespace, "t")[0]?.textContent || ""));
        assert("XLSX detailed statuses match every preview and CSV record", values.length === csvReport.rows.length && values.every((item, index) => JSON.stringify(item) === JSON.stringify(exportedRecords[index])));
        const calendarXml = parts.get("xl/worksheets/sheet1.xml");
        assert("XLSX monthly grid includes every leap-February date", csvReport.rows.every((record) => calendarXml.includes(record.dateLabel)));
        assert("XLSX saves formula-like names as text without formula elements", calendarXml.includes("=HYPERLINK") && !calendarXml.includes("<f>") && !parts.get("xl/worksheets/sheet2.xml").includes("<f>"));
        document.querySelector("#result").textContent = "PASS " + checks.length + ": " + checks.join("; ");
    } catch (error) {
        document.querySelector("#result").textContent = "FAIL: " + error.message;
        document.documentElement.dataset.testError = error.stack || error.message;
    }
})();
</script>
